name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  # 部署到一半被取消可能留下旧的 gh-pages，排队执行更稳妥
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dashboard code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install package and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package build output
        run: |
          cd public
          # 固定文件名，下载地址不随构建变化
          zip -qr "$RUNNER_TEMP/yacd-dashboard.zip" . -x 'download/*'
          mkdir -p download
          mv "$RUNNER_TEMP/yacd-dashboard.zip" download/yacd-dashboard.zip

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          enable_jekyll: false
          # 每次部署只保留一个提交，避免压缩包的历史版本撑大仓库
          force_orphan: true
